<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Apex Core Overlook</title>
  <desc id="description">Aurion faces the control tower above a neon city held in Viktor's surveillance grid.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#070b19"/>
      <stop offset=".58" stop-color="#14213a"/>
      <stop offset="1" stop-color="#27152d"/>
    </linearGradient>
    <linearGradient id="tower" x2="1" y2="0">
      <stop stop-color="#101c31"/>
      <stop offset=".42" stop-color="#263c56"/>
      <stop offset=".5" stop-color="#9bf8f1"/>
      <stop offset=".56" stop-color="#23384e"/>
      <stop offset="1" stop-color="#101727"/>
    </linearGradient>
    <linearGradient id="glass" x2="0" y2="1">
      <stop stop-color="#72e8ed" stop-opacity=".66"/>
      <stop offset=".22" stop-color="#152e4c" stop-opacity=".78"/>
      <stop offset="1" stop-color="#090e1b" stop-opacity=".96"/>
    </linearGradient>
    <linearGradient id="floor" x2="0" y2="1">
      <stop stop-color="#172638"/>
      <stop offset="1" stop-color="#050810"/>
    </linearGradient>
    <radialGradient id="coreGlow">
      <stop stop-color="#d8fff8" stop-opacity=".88"/>
      <stop offset=".18" stop-color="#66f4df" stop-opacity=".42"/>
      <stop offset="1" stop-color="#66f4df" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cityGlow">
      <stop stop-color="#ff704f" stop-opacity=".42"/>
      <stop offset="1" stop-color="#ff704f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="windows" width="20" height="24" patternUnits="userSpaceOnUse">
      <rect x="4" y="5" width="3" height="8" fill="#68e8df" opacity=".58"/>
      <rect x="12" y="5" width="3" height="8" fill="#f3a978" opacity=".34"/>
    </pattern>
    <pattern id="floorGrid" width="48" height="48" patternUnits="userSpaceOnUse" patternTransform="skewX(-28)">
      <path d="M48 0H0V48" fill="none" stroke="#5be8e0" stroke-opacity=".15" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#sky)"/>
  <ellipse cx="517" cy="451" rx="480" ry="260" fill="url(#coreGlow)"/>
  <ellipse cx="881" cy="572" rx="270" ry="190" fill="url(#cityGlow)"/>

  <g fill="#182339" stroke="#31415a" stroke-width="2">
